# Default council — strangers / 5-minute path
# A4: synthesizer is an explicit seat (not a hidden chair)
id: council-lite
name: Council Lite
description: Architect + Analyst + Engineer + 顯性 Synthesizer。預設入口。
seats:
  - id: architect
    role: Architect
    mission: 目標是否對、邊界、風險、是否該做
  - id: analyst
    role: Analyst
    mission: 結構、一致性、可驗證事實、缺口
  - id: engineer
    role: Engineer
    mission: 可不可做、怎麼驗、實作風險
  - id: synthesizer
    role: Synthesizer
    mission: 綜合各席結構化產出；標共識／分歧／判決；不得發明未出現的事實
    kind: synthesizer
synthesis: true
harness:
  wall_max_retries: 2
  require_verdict: true
  no_self_accept: false
